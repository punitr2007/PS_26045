services:
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: ip_shakti_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./code/backend/.env
    environment:
      - PORT=8000
      - WORKERS=2
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
    volumes:
      - backend_checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
      args:
        # Browser clients make API calls directly to the exposed backend host/port
        - VITE_BACKEND_URL=http://localhost:8000
    container_name: ip_shakti_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_checkpoints:
